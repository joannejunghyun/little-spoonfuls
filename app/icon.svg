  <path d="M32 22 Q30 17 32 12" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M41 24 Q39 19 41 14" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>

