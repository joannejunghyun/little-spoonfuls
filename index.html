<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Little Spoonfuls</title>
    <style>
        :root {
            --peach: #ffb8b8;
            --cream: #fffaf5;
            --mint: #b8e994;
            --text: #57606f;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--cream);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 184, 184, 0.15);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 { 
            color: var(--peach); 
            font-size: 28px; 
            margin-bottom: 5px;
            font-family: "Apple SD Gothic Neo", "Segoe UI", sans-serif;
        }
        .tagline { 
            font-size: 15px; 
            color: #a4b0be; 
            margin-bottom: 30px; 
            line-height: 1.4;
        }
        
        .setup-box {
            background: #fff9f4;
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid #ffefe0;
            text-align: left;
        }
        .input-group { margin-bottom: 15px; }
        label { 
            display: block; 
            font-size: 11px; 
            font-weight: 800; 
            color: #d1ccc0; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%; 
            padding: 14px; 
            border: 1px solid #f1f2f6; 
            border-radius: 15px; 
            font-size: 16px; 
            background: white;
            outline: none;
            color: var(--text);
        }

        .btn-generate {
            width: 100%; 
            padding: 18px; 
            background: var(--peach); 
            color: white; 
            border: none; 
            border-radius: 20px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 184, 184, 0.4);
            transition: 0.3s;
        }
        .btn-generate:active { transform: scale(0.96); opacity: 0.9; }

        .menu-result { margin-top: 35px; display: none; text-align: left; animation: fadeInUp 0.5s ease; }
        .stage-badge { 
            background: #f0faff; 
            color: #74b9ff; 
            padding: 6px 15px; 
            border-radius: 15px; 
            font-size: 12px; 
            font-weight: bold; 
            display: inline-block; 
            margin-bottom: 20px;
        }
        .meal-card { 
            background: #fff; 
            border: 1px solid #f9f9f9; 
            padding: 18px; 
            border-radius: 20px; 
            margin-bottom: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border-left: 5px solid var(--peach);
        }
        .meal-type { font-size: 10px; font-weight: 900; color: #ced6e0; text-transform: uppercase; letter-spacing: 1px; }
        .meal-title { display: block; margin-top: 6px; font-size: 16px; color: #2f3542; font-weight: 500; }

        footer { 
            margin-top: 40px; 
            text-align: center; 
            font-size: 14px; 
            color: #bdc3c7; 
            line-height: 1.6;
            padding-bottom: 30px;
        }
        footer a { color: var(--peach); text-decoration: none; font-weight: bold; }
        .heart { color: #ff7675; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Little Spoonfuls 🥣</h1>
    <p class="tagline">For our tiny tummies.<br>Thinking of what to cook for baby is hard, let's decide together!</p>
    
    <div class="setup-box">
        <div class="input-group">
            <label>Baby's age (In Days)</label>
            <input type="number" id="days" value="218" inputmode="numeric">
        </div>
        <div class="input-group">
            <label>Dietary style</label>
            <select id="diet">
                <option value="all">All (Omnivore)</option>
                <option value="vegetarian">Vegetarian</option>
                <option value="vegan">Vegan</option>
            </select>
        </div>
        <div class="input-group">
            <label>Today's Flavor</label>
            <select id="cuisine">
                <option value="mix">Global Mix 🌎</option>
                <option value="korean">Korean 🇰🇷</option>
                <option value="western">Western 🇺🇸</option>
                <option value="chinese">Chinese 🇨🇳</option>
            </select>
        </div>
    </div>

    <button class="btn-generate" onclick="generateMenu()">Plan Today's Bites</button>

    <div id="menuResult" class="menu-result">
        <div id="stageInfo" class="stage-badge"></div>
        
        <div class="meal-card">
            <span class="meal-type">Breakfast</span>
            <span id="b" class="meal-title"></span>
        </div>
        <div class="meal-card">
            <span class="meal-type">Lunch</span>
            <span id="l" class="meal-title"></span>
        </div>
        <div class="meal-card">
            <span class="meal-type">Quick Snack</span>
            <span id="s" class="meal-title"></span>
        </div>
        <div class="meal-card">
            <span class="meal-type">Dinner</span>
            <span id="d" class="meal-title"></span>
        </div>
    </div>
</div>

<footer>
    Designed for my baby boy <b>Danu</b> & all the moms out there.<br>
    Made with <span class="heart">❤️</span> by <a href="https://www.linkedin.com/in/junghyunhao/" target="_blank">Joanne</a>
</footer>

<script>
const pantry = {
    korean: {
        grains: ["Rice Juk", "Millet Porridge", "Sweet Rice Mash", "Oat-Rice Juk", "Black Rice Mium"],
        proteins_all: ["Finely Minced Beef", "Steamed Cod Silk", "Chicken Breast Paste", "Egg Yolk", "Shrimp Paste", "Boiled Pork Mince", "Abalone Mince"],
        proteins_veg: ["Silken Tofu", "Soybean Curd", "Steamed Egg Custard", "Soft Curd Cheese", "Mashed Mung Beans"],
        veggies: ["Aehobak (Zucchini)", "Yellow Pumpkin", "Spinach", "Radish", "Shiitake", "Carrot", "Bok Choy", "Broccoli", "Cabbage"],
        fruits: ["Korean Pear", "Apple Mash", "Persimmon", "Strawberry juice", "Melon puree"]
    },
    western: {
        grains: ["Oatmeal", "Quinoa Puree", "Mashed Potato", "Sweet Potato Bowl", "Pasta Stars", "Barley Mash"],
        proteins_all: ["Turkey Puree", "Salmon Flakes", "Beef Stew (Minced)", "Hard Boiled Egg", "Chicken Liver Puree", "White Fish Flakes"],
        proteins_veg: ["Cottage Cheese", "Greek Yogurt", "Chickpea Mash", "Red Lentil Stew", "Ricotta"],
        veggies: ["Green Peas", "Butternut Squash", "Cauliflower", "Avocado", "Asparagus", "Green Beans", "Parsnip", "Sweet Corn"],
        fruits: ["Blueberries", "Banana", "Peach", "Prunes", "Raspberry puree", "Apricot"]
    },
    chinese: {
        grains: ["White Congee", "Millet Porridge", "Wheat Noodle Soup", "Yam & Rice Mash", "Red Bean Congee"],
        proteins_all: ["Pork Mince", "Shrimp Silk", "Flaked Snapper", "Minced Chicken", "Egg Custard", "Minced Duck"],
        proteins_veg: ["Silken Tofu", "Soft Bean Curd", "Steamed Egg", "Mashed Red Beans", "Peanut butter (thinned)"],
        veggies: ["Bok Choy", "Chinese Yam (Nagaimo)", "Winter Melon", "Lotus Root", "Goji Berry (infused)", "Tomato (soft)", "Chinese Cabbage"],
        fruits: ["Papaya", "Dragonfruit", "Watermelon", "Mango puree", "Steamed Pear"]
    }
};

function getRand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateMenu() {
    const days = parseInt(document.getElementById('days').value);
    const diet = document.getElementById('diet').value;
    let cuisine = document.getElementById('cuisine').value;
    
    if (days < 180) { 
        alert("Usually, little spoonfuls start around 180 days! Keep breastfeeding or formula for now ❤️"); 
        return; 
    }

    let stage = "";
    let texture = "";

    if (days <= 240) { stage = "Stage 1: Smooth Purees"; texture = "Smooth "; }
    else if (days <= 365) { stage = "Stage 2: Soft Mashes"; texture = "Softly Mashed "; }
    else if (days <= 540) { stage = "Stage 3: Chopped Bites"; texture = "Finely Chopped "; }
    else { stage = "Stage 4: Tiny Table Food"; texture = "Bite-sized "; }

    function buildMeal(cusType) {
        let pool = pantry[cusType];
        let pPool = (diet === 'all') ? pool.proteins_all : pool.proteins_veg;
        if (diet === 'vegan') pPool = pool.proteins_veg.filter(p => !p.includes("Egg") && !p.includes("Cheese") && !p.includes("Yogurt") && !p.includes("Custard"));

        return {
            b: texture + getRand(pool.grains) + " with " + getRand(pool.fruits),
            l: texture + getRand(pPool) + " & " + getRand(pool.veggies) + " with " + getRand(pool.grains),
            s: "A few tiny bites of " + getRand(pool.fruits) + (days > 365 ? " pieces" : " puree"),
            d: texture + getRand(pPool) + " cooked with " + getRand(pool.veggies)
        };
    }

    let finalCus = (cuisine === 'mix') ? getRand(['korean', 'western', 'chinese']) : cuisine;
    const recipe = buildMeal(finalCus);

    document.getElementById('stageInfo').innerText = "✨ " + stage;
    document.getElementById('b').innerText = recipe.b;
    document.getElementById('l').innerText = recipe.l;
    document.getElementById('s').innerText = recipe.s;
    document.getElementById('d').innerText = recipe.d;
    
    document.getElementById('menuResult').style.display = 'block';
    window.scrollTo({ top: document.getElementById('menuResult').offsetTop - 20, behavior: 'smooth' });
}
</script>

</body>
</html>
